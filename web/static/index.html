<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>code-asker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="code-asker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161b22">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" type="button" aria-label="戻る" hidden>‹</button>
  <div id="title">code-asker</div>
  <button id="search" type="button" aria-label="検索" hidden>🔍</button>
  <div id="tools" hidden>
    <button id="chatbtn" type="button" aria-label="AIに質問">💬</button>
    <button id="symbols" type="button" aria-label="シンボル一覧">{ }</button>
    <button id="fs-dec" type="button" aria-label="文字を小さく">A−</button>
    <button id="fs-inc" type="button" aria-label="文字を大きく">A+</button>
    <button id="wrap" type="button" aria-label="折り返し切替">⏎</button>
  </div>
</header>
<main id="view"></main>
<div id="chat" hidden>
  <div id="chat-head"><div id="chat-loc"></div><button id="chat-new" type="button">新規</button><button id="chat-close" type="button" aria-label="閉じる">✕</button></div>
  <div id="chat-log"></div>
  <form id="chat-form"><textarea id="chat-q" rows="2" placeholder="見えている範囲について質問…" autocapitalize="off"></textarea><button id="chat-send" type="submit">送信</button></form>
</div>
<div id="sheet" hidden>
  <div id="sheet-head"><span id="sheet-title"></span><button id="sheet-close" type="button" aria-label="閉じる">✕</button></div>
  <div id="sheet-body"></div>
</div>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
